apply plugin: 'com.android.application'

// Release versioning is driven by CI env vars so a tag push produces a
// deterministic, numeric versionName. `android/app/build.gradle` MUST never
// receive a value like "main" or "v1.0" — Android rejects it and the APK step
// fails late in the Gradle run. Strip every non-numeric/non-dot character and
// fall back to 1.0.0 when the env is absent (local builds).
def rawVersionName = System.getenv("APP_VERSION_NAME") ?: "1.0.0"
def safeVersionName = rawVersionName.replaceAll("[^0-9.]", "")
if (!(safeVersionName ==~ /\d+(\.\d+)*/)) {
    safeVersionName = "1.0.0"
}
// GitHub run number gives a monotonically increasing versionCode; local = 1.
def safeVersionCode = (System.getenv("APP_VERSION_CODE") ?: "1").replaceAll("[^0-9]", "")
if (safeVersionCode.isEmpty()) {
    safeVersionCode = "1"
}

android {
    namespace "com.naveenbharat.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.naveenbharat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode safeVersionCode.toInteger()
        versionName safeVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Ship only the ABIs that real devices and the CI emulator need.
        // 32-bit x86 has no device or emulator target left (the CI emulator is
        // x86_64) and cost ~4.7 MB of native libs in every APK.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Stable debug signing key committed at android/keystore/debug.keystore.
    // Android's auto-generated ~/.android/debug.keystore is regenerated on every
    // fresh CI runner, so its SHA-256 changes each build and Android App Links
    // could never verify against .well-known/assetlinks.json. Pinning the key
    // makes the fingerprint deterministic. This is a DEBUG key only — it is not
    // a secret and must never be used for a Play Store release build.
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}


repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
