name: E2E (Playwright)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Fails loudly here rather than at runtime if the runner is missing.
      - name: Verify @playwright/test is declared
        run: test -d node_modules/@playwright/test

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E
        run: ./node_modules/.bin/playwright test --project=chromium --project=mobile-chrome
        env:
          CI: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5
