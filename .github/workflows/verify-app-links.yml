name: Verify App Links (live hosts)

# Probes every origin in src/config/deepLinks.ts APP_LINK_HOSTS and fails when a
# host does not serve a usable assetlinks.json for the current app id.
#
# Why a scheduled job: the build-time guard (check-deep-links.mjs) only sees the
# repo. A Vercel deploy that forgot ANDROID_CERT_SHA256 still ships
# `sha256_cert_fingerprints: []`, Android's autoVerify then fails SILENTLY and
# every https deep link opens in Chrome. This job is the only thing that sees
# what Android sees.

on:
  schedule:
    - cron: '17 4 * * *' # daily 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Probe assetlinks.json on every App Link host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe hosts
        run: node scripts/verify-app-links.mjs --strict
