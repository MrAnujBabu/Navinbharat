name: Naveen Bharat APK

# Release-signed APK build + GitHub Release.
#   - push of a `v*` tag  -> builds and attaches the APK to a Release
#   - workflow_dispatch    -> builds an artifact only
#
# Stack pins (do NOT drift): Node 24, Bun, JDK 21 Temurin, Android SDK 35,
# Gradle 8.11.1 / AGP 8.7.2 (Capacitor 7).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Numeric versionName (e.g. 1.2.0). Never "main"/"v1.0".'
        required: false
        default: '1.0.0'

permissions:
  contents: write

env:
  # actions/* still ship a node20 runtime in action.yml; this makes the runner
  # execute them on node24 so only a soft annotation remains. Do NOT remove,
  # and never add ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION (opposite direction).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve numeric APP_VERSION_NAME
        run: |
          set -e
          RAW="${{ github.event.inputs.version_name }}"
          if [ -z "$RAW" ]; then
            RAW="${GITHUB_REF_NAME}"
          fi
          # Strip everything that is not a digit or a dot ("v1.2.0" -> "1.2.0").
          SAFE=$(printf '%s' "$RAW" | tr -cd '0-9.')
          case "$SAFE" in
            ''|.*|*..*) SAFE="1.0.0" ;;
          esac
          echo "APP_VERSION_NAME=$SAFE" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Resolved versionName=$SAFE versionCode=${GITHUB_RUN_NUMBER}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          set -e
          bun install --no-save || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck (tsgo — never tsc)
        run: bun run typecheck

      - name: Repo guards
        run: |
          set -e
          bun run guard:all
          bun run check:lockfile

      - name: Build web assets
        run: bun run build

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-jdk21-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/variables.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk21-
            gradle-${{ runner.os }}-

      # Syncs through scripts/cap-sync.mjs, which also strips the hidden source
      # maps out of the packaged assets — bare `cap sync` copies 31 MB of .map
      # files into the APK (that is what made v1.0.5 50 MB instead of ~20 MB).
      - name: Capacitor sync (dist -> android)
        run: bun run cap:sync android

      # The production keystore lives only in repo secrets. It is decoded to a path
      # outside the repo tree so it can never be committed or packaged, and the
      # file is removed again once the APK is signed.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is empty — cannot produce a release-signed APK"; exit 1; }
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          test -s "$RUNNER_TEMP/signing/release.keystore" || { echo "::error::decoded keystore is empty — KEYSTORE_BASE64 is not valid base64"; exit 1; }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      # Signing fails deep inside :app:packageRelease with an unreadable
      # "Given final block not properly padded" when the key password does not
      # match the alias. Probe it here instead: `-certreq` needs the *private
      # key*, so it is the cheapest real check of storepass + alias + keypass.
      # Many keystores are created with the key password equal to the store
      # password, so fall back to that before failing.
      - name: Verify keystore credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || { echo "::error::KEYSTORE_PASSWORD does not open the keystore"; exit 1; }
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::KEY_ALIAS is not present in the keystore"; exit 1; }
          # PKCS12 keystores protect entries with the *store* password; keytool
          # silently accepts any -keypass there, but Gradle passes it straight to
          # the JCE and fails with "Given final block not properly padded".
          TYPE=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
                 | sed -n 's/^Keystore type: //p' | head -1)
          echo "Keystore type: ${TYPE:-unknown}"
          if [ "$TYPE" = "PKCS12" ] || [ "$TYPE" = "pkcs12" ]; then
            echo "PKCS12 keystore -> key password must equal the store password"
            echo "RESOLVED_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            exit 0
          fi
          probe() {
            keytool -certreq -alias "$KEY_ALIAS" -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$1" >/dev/null 2>&1
          }
          if probe "$KEY_PASSWORD"; then
            echo "Key password: KEY_PASSWORD secret"
            echo "RESOLVED_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          elif probe "$KEYSTORE_PASSWORD"; then
            echo "::warning::KEY_PASSWORD did not unlock the key; using KEYSTORE_PASSWORD (key password == store password)"
            echo "RESOLVED_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::error::Neither KEY_PASSWORD nor KEYSTORE_PASSWORD unlocks alias '$KEY_ALIAS'. Update the KEY_PASSWORD repo secret."
            exit 1
          fi

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.RESOLVED_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --parallel --build-cache

      # Gradle emits `app-release.apk`. Users download this straight from the
      # Release page, so rename it to the product name before anything else
      # references it. Renaming here (not via archivesBaseName) keeps the Gradle
      # config untouched.
      - name: Name the APK "Naveen Bharat"
        run: |
          set -e
          OUT=android/app/build/outputs/apk/release
          mv "$OUT/app-release.apk" "$OUT/Naveen-Bharat.apk"
          ls -lh "$OUT/Naveen-Bharat.apk"

      # A release build that silently fell back to the debug key would install
      # fine and break every https:// App Link. Assert the certificate before
      # anything is published.
      - name: Verify release signature
        env:
          EXPECTED_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/Naveen-Bharat.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found in the Android SDK"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"
          FP="$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -i 'SHA-256 digest' | sed -E 's/.*: *//' | tr -d ' \r' | tr 'a-f' 'A-F' | sed -E 's/(..)/\1:/g; s/:$//')"
          FP1="$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -i 'SHA-1 digest' | sed -E 's/.*: *//' | tr -d ' \r' | tr 'a-f' 'A-F' | sed -E 's/(..)/\1:/g; s/:$//')"
          echo "Release certificate SHA-256: $FP"
          echo "Release certificate SHA-1:   $FP1"
          if [ "$FP" = "96:32:FF:20:C8:AD:43:B9:16:26:9C:C7:89:C5:84:BD:CD:AB:7B:01:31:51:88:A4:13:86:D0:D6:5E:FA:1B:1F" ]; then
            echo "::error::APK is signed with the committed DEBUG key — release signing did not take effect"
            exit 1
          fi
          if [ -n "$EXPECTED_SHA256" ]; then
            NORM="$(printf '%s' "$EXPECTED_SHA256" | tr -d ' \r' | tr 'a-f' 'A-F')"
            case "$NORM" in *:*) ;; *) NORM="$(printf '%s' "$NORM" | sed -E 's/(..)/\1:/g; s/:$//')" ;; esac
            # Accept either digest form: some projects pin the SHA-1 App Links
            # fingerprint in this secret. Anything else is a real key mismatch.
            if [ "$NORM" = "$FP" ] || [ "$NORM" = "$FP1" ]; then
              echo "Certificate matches the pinned ANDROID_CERT_SHA256 secret."
            else
              echo "::error::pinned certificate secret matches neither the release SHA-256 ($FP) nor SHA-1 ($FP1). Update ANDROID_CERT_SHA256 to the SHA-256 above, or fix the keystore."
              exit 1
            fi
          else
            echo "::warning::ANDROID_CERT_SHA256 is not set — skipped the pinned-certificate comparison."
          fi

          rm -f "$KEYSTORE_PATH"

      - name: APK smoke check
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/Naveen-Bharat.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          grep -q "MainActivity" android/app/src/main/AndroidManifest.xml \
            || { echo "::error::MainActivity missing from AndroidManifest"; exit 1; }
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          test -f "$PLUGINS" || { echo "::error::capacitor.plugins.json missing — re-run cap sync"; exit 1; }
          COUNT=$(grep -c '"pkg"' "$PLUGINS" || true)

          # Source maps must never ship to devices: ~31 MB of dead weight plus
          # the full readable source. scripts/cap-sync.mjs strips them; this
          # asserts the strip actually happened inside the packaged APK.
          if unzip -l "$APK" | grep -q "assets/public/.*\.map"; then
            echo "::error::source maps found inside the APK — run bun run cap:sync, not bare cap sync"
            unzip -l "$APK" | grep "assets/public/.*\.map" | head -n 10
            exit 1
          fi

          # Size ceiling: catches a bundle regression (or maps creeping back in)
          # before it ships. v1.0.5 shipped 50.2 MB; dropping the source maps
          # (~8.5 MB packed) and the dead 32-bit x86 ABI (~4.7 MB) lands ~36 MB,
          # v1.0.7 measured 38 MB against a 38 MB gate — zero headroom, so any
          # new plugin broke the build. Ceiling is 40 MB: still tight enough to
          # catch a real regression, wide enough for one more plugin.
          SIZE=$(stat -c%s "$APK")
          MAX_MB=40
          MAX=$((MAX_MB * 1024 * 1024))
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::APK is $((SIZE / 1024 / 1024)) MB, over the ${MAX_MB} MB ceiling."
            exit 1
          fi
          echo "APK $(du -h "$APK" | cut -f1) with $COUNT Capacitor plugins bundled, no source maps."

      # Boots the built APK on a real emulator: catches runtime crashes that a
      # file-existence smoke check cannot (missing plugin classes, bad WebView
      # config, release-only ProGuard damage).
      #
      # v1.0.8 failed here with 78 consecutive "adb: device offline" polls and
      # then a boot timeout. The root cause was NOT flake: the emulator logged
      #   TCG doesn't support requested feature: CPUID.01H:ECX.avx
      # "TCG" is QEMU's *software* CPU emulator, i.e. the runner started the
      # AVD without KVM. Under TCG an API-34 google_apis Pixel-6 image with
      # 4 GB RAM cannot finish booting inside any sane timeout, so the poll
      # loop just runs until the job dies. Fix = give the runner /dev/kvm and
      # boot a much lighter image.
      - name: Enable KVM for the emulator
        run: |
          set -e
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Fail loudly in 5 seconds instead of looping "device offline" for
          # 20 minutes: without KVM this step can never pass.
          test -e /dev/kvm || { echo "::error::/dev/kvm missing — runner has no hardware acceleration, emulator would fall back to TCG and never boot"; exit 1; }
          ls -l /dev/kvm

      # Leftover adb servers from the SDK setup step make the emulator runner
      # log an "orphan adb process" warning and can wedge device discovery.
      - name: Reset adb before emulator
        run: adb kill-server || true

      # Deliberately lighter than the build target: API 30 / `default` (no Play
      # services) / 2 GB boots in ~60-70s with KVM. google_apis + pixel_6 +
      # 4096M bought nothing for a boot smoke test and doubled boot time.
      - name: Emulator boot smoke test (attempt 1)
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/check-apk-boot.sh

      - name: Reset adb between attempts
        if: steps.emu1.outcome == 'failure'
        run: adb kill-server || true

      # One retry for genuine runner flake. Both failing = a real problem.
      - name: Emulator boot smoke test (attempt 2)
        if: steps.emu1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/check-apk-boot.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: naveen-bharat-apk-${{ env.APP_VERSION_NAME }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/Naveen-Bharat.apk
          retention-days: 1  # repository maximum
          if-no-files-found: error

      - name: Sentry release smoke test
        if: ${{ env.SENTRY_DSN != '' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_ENVIRONMENT: release
        run: bunx tsx scripts/sentry-smoke.ts

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Naveen Bharat ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/Naveen-Bharat.apk
          generate_release_notes: true

