name: Naveen Bharat APK

# Debug APK build + GitHub Release.
#   - push of a `v*` tag  -> builds and attaches the APK to a Release
#   - workflow_dispatch    -> builds an artifact only
#
# Stack pins (do NOT drift): Node 24, Bun, JDK 21 Temurin, Android SDK 35,
# Gradle 8.11.1 / AGP 8.7.2 (Capacitor 7).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Numeric versionName (e.g. 1.2.0). Never "main"/"v1.0".'
        required: false
        default: '1.0.0'

permissions:
  contents: write

env:
  # actions/* still ship a node20 runtime in action.yml; this makes the runner
  # execute them on node24 so only a soft annotation remains. Do NOT remove,
  # and never add ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION (opposite direction).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve numeric APP_VERSION_NAME
        run: |
          set -e
          RAW="${{ github.event.inputs.version_name }}"
          if [ -z "$RAW" ]; then
            RAW="${GITHUB_REF_NAME}"
          fi
          # Strip everything that is not a digit or a dot ("v1.2.0" -> "1.2.0").
          SAFE=$(printf '%s' "$RAW" | tr -cd '0-9.')
          case "$SAFE" in
            ''|.*|*..*) SAFE="1.0.0" ;;
          esac
          echo "APP_VERSION_NAME=$SAFE" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Resolved versionName=$SAFE versionCode=${GITHUB_RUN_NUMBER}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          set -e
          bun install --no-save || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck (tsgo — never tsc)
        run: bun run typecheck

      - name: Repo guards
        run: |
          set -e
          bun run guard:all
          bun run check:lockfile

      - name: Build web assets
        run: bun run build

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Capacitor sync (dist -> android)
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          set -e
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --parallel --build-cache

      - name: APK smoke check
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          grep -q "MainActivity" android/app/src/main/AndroidManifest.xml \
            || { echo "::error::MainActivity missing from AndroidManifest"; exit 1; }
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          test -f "$PLUGINS" || { echo "::error::capacitor.plugins.json missing — re-run cap sync"; exit 1; }
          COUNT=$(grep -c '"pkg"' "$PLUGINS" || true)
          echo "APK $(du -h "$APK" | cut -f1) with $COUNT Capacitor plugins bundled."

      # Boots the built APK on a real emulator: catches runtime crashes that a
      # file-existence smoke check cannot (missing plugin classes, bad WebView
      # config, release-only ProGuard damage). Non-blocking on infra flake would
      # defeat the point, so this gates the release.
      - name: Emulator boot smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/check-apk-boot.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naveen-bharat-apk-${{ env.APP_VERSION_NAME }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Sentry release smoke test
        if: ${{ env.SENTRY_DSN != '' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_ENVIRONMENT: release
        run: bunx tsx scripts/sentry-smoke.ts

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Naveen Bharat ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
