name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function:
        description: "Function name to deploy (blank = pdf-proxy)"
        required: false
        default: "pdf-proxy"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cmbattmjwriiesibayfk
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is missing"
            exit 1
          fi
      - name: Deploy
        run: |
          FN="${{ github.event.inputs.function }}"
          [ -z "$FN" ] && FN=pdf-proxy
          supabase functions deploy "$FN" --project-ref "$PROJECT_REF" --use-api
