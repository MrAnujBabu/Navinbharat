name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function:
        description: "Function name to deploy (blank = pdf-proxy)"
        required: false
        default: "pdf-proxy"

jobs:
  deploy:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from Oct 2026 (GitHub notice);
    # change this deliberately, not by surprise.
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cmbattmjwriiesibayfk
    steps:
      # checkout@v5 / setup-cli@v3 run on Node 24 (v4 / v1 were Node 20, which
      # GitHub deprecated and flagged as a warning on every deploy).
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is missing"
            exit 1
          fi
      - name: Deploy
        run: |
          FN="${{ github.event.inputs.function }}"
          [ -z "$FN" ] && FN=pdf-proxy
          supabase functions deploy "$FN" --project-ref "$PROJECT_REF" --use-api --yes
